[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling project with candidate scoring and LLM logits"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
